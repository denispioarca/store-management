spring:
  application:
    name: store-management

  datasource:
    url: jdbc:h2:mem:storedb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
    # H2 in-memory database running in PostgreSQL compatibility mode

  jpa:
    hibernate:
      ddl-auto: validate   # Validate schema generated by Flyway
    properties:
      hibernate:
        format_sql: true   # Pretty-print SQL in logs
    open-in-view: false     # Disable Open Session in View (best practice)

  h2:
    console:
      enabled: true         # Enable H2 web console for development
      path: /h2-console     # Access at http://localhost:8080/h2-console

  flyway:
    enabled: true
    locations: classpath:db/migration  # Flyway migration folder

logging:
  level:
    root: INFO
    org.hibernate.SQL: DEBUG       # Log generated SQL
    org.hibernate.type: TRACE      # Log SQL parameters